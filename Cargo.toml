[package]
name = "google-mcp"
version = "0.1.0"
edition = "2021"
description = "Standalone stdio MCP server exposing Gmail and Google Calendar tools"
license = "MIT"
repository = "https://github.com/micro-tech/google-mcp"

[[bin]]
name = "google-mcp"
path = "src/main.rs"

[dependencies]
# MCP server framework (stdio transport)
rmcp = { version = "3.5.0", features = ["transport-io"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization / tool schemas
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# Errors, logging (logs go to stderr — stdout is the MCP wire)
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Google APIs
google-gmail1 = "7.0.0"
google-calendar3 = "7.0.0"
yup-oauth2 = "12"
# HTTP stack for the Google API hubs
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http1", "http2", "rustls-native-certs", "native-tokio"] }
http-body-util = "0.1"
# Pin the rustls crypto provider (ring), mirroring Helix's main.rs
rustls = { version = "0.23", features = ["ring"] }
bytes = "1"
# Misc
base64 = "0.22"
chrono = "0.4"
dirs = "5"
